<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>播放器</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Microsoft Yahei", sans-serif;
    }
    body {
      background: #f5f7fa;
      padding: 20px;
    }
    .back {
      font-size: 16px;
      margin-bottom: 15px;
      color: #2196f3;
      cursor: pointer;
    }
    .player-container {
      max-width: 600px;
      margin: 0 auto;
      background: white;
      border-radius: 12px;
      padding: 25px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }
    .search-box {
      margin-bottom: 15px;
    }
    .search-input {
      width: 100%;
      padding: 10px 15px;
      border-radius: 20px;
      border: 1px solid #eee;
      outline: none;
    }
    .cover {
      width: 180px;
      height: 180px;
      border-radius: 50%;
      margin: 0 auto;
      display: block;
      object-fit: cover;
    }
    .song-info {
      text-align: center;
      margin: 15px 0;
    }
    .progress-bar {
      width: 100%;
      height: 6px;
      background: #eee;
      border-radius: 3px;
      margin: 10px 0;
      position: relative;
      cursor: pointer;
    }
    .progress-current {
      position: absolute;
      left: 0;
      top: 0;
      height: 100%;
      background: #2196f3;
      border-radius: 3px;
      width: 0%;
    }
    .time {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: #999;
    }
    .controls {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin: 20px 0;
    }
    .btn {
      width: 45px;
      height: 45px;
      border-radius: 50%;
      background: #2196f3;
      color: white;
      border: none;
      font-size: 18px;
      cursor: pointer;
    }
    .song-list {
      margin-top: 20px;
      max-height: 300px;
      overflow-y: auto;
    }
    .song-item {
      padding: 12px 15px;
      border-bottom: 1px solid #f0f0f0;
      cursor: pointer;
    }
    .song-item.active {
      background: #e3f2fd;
      color: #2196f3;
    }
  </style>
</head>

<body>
  <div class="player-container">
    <div class="back" onclick="history.back()">← 返回专辑</div>

    <div class="search-box">
      <input class="search-input" id="search" placeholder="模糊搜索歌曲">
    </div>

    <img src="" id="cover" class="cover">
    <div class="song-info">
      <div id="songName">请播放歌曲</div>
      <div id="albumName"></div>
    </div>

    <div class="progress-bar" id="progressBar">
      <div class="progress-current" id="progress"></div>
    </div>
    <div class="time">
      <span id="currTime">00:00</span>
      <span id="totalTime">00:00</span>
    </div>

    <div class="controls">
      <button class="btn" id="prev">◀</button>
      <button class="btn" id="play">▶</button>
      <button class="btn" id="next">▶▶</button>
    </div>

    <div class="song-list" id="songList"></div>
  </div>

  <script src="music.js"></script>
  <script>
    const audio = new Audio();
    const urlParams = new URLSearchParams(location.search);
    const targetAlbum = urlParams.get('album');

    // 只显示当前专辑的歌曲
    let albumSongs = list.filter(s => s.artist === targetAlbum);
    let currIndex = 0;
    let isPlaying = false;

    const dom = {
      cover: document.getElementById('cover'),
      songName: document.getElementById('songName'),
      albumName: document.getElementById('albumName'),
      progress: document.getElementById('progress'),
      currTime: document.getElementById('currTime'),
      totalTime: document.getElementById('totalTime'),
      play: document.getElementById('play'),
      songList: document.getElementById('songList'),
      search: document.getElementById('search')
    };

    // 初始化
    window.onload = () => {
      renderList(albumSongs);
      loadSong(0);
      bindEvents();
    };

    // 渲染歌曲
    function renderList(songs) {
      dom.songList.innerHTML = '';
      songs.forEach((song, i) => {
        const div = document.createElement('div');
        div.className = `song-item ${i === currIndex ? 'active' : ''}`;
        div.innerText = song.name;
        div.onclick = () => {
          currIndex = i;
          playSong();
        };
        dom.songList.appendChild(div);
      });
    }

    // 加载歌曲
    function loadSong(i) {
      const s = albumSongs[i];
      audio.src = s.url;
      dom.cover.src = s.cover;
      dom.songName.textContent = s.name;
      dom.albumName.textContent = s.artist;
    }

    function playSong() {
      loadSong(currIndex);
      audio.play();
      isPlaying = true;
      dom.play.textContent = '❚❚';
      renderList(albumSongs);
    }
    function pauseSong() {
      audio.pause();
      isPlaying = false;
      dom.play.textContent = '▶';
    }
    function prev() {
      currIndex = (currIndex - 1 + albumSongs.length) % albumSongs.length;
      playSong();
    }
    function next() {
      currIndex = (currIndex + 1) % albumSongs.length;
      playSong();
    }

    // 搜索
    dom.search.oninput = e => {
      const kw = e.target.value.toLowerCase();
      const filter = albumSongs.filter(s => s.name.toLowerCase().includes(kw));
      renderList(filter);
    };

    // 事件
    function bindEvents() {
      dom.play.onclick = () => isPlaying ? pauseSong() : playSong();
      document.getElementById('prev').onclick = prev;
      document.getElementById('next').onclick = next;

      audio.ontimeupdate = () => {
        const p = (audio.currentTime / audio.duration) * 100;
        dom.progress.style.width = p + '%';
        dom.currTime.textContent = fmt(audio.currentTime);
      };
      audio.onloadedmetadata = () => dom.totalTime.textContent = fmt(audio.duration);
      audio.onended = next;
    }

    function fmt(s) {
      const m = Math.floor(s / 60).toString().padStart(2, '0');
      const sec = Math.floor(s % 60).toString().padStart(2, '0');
      return `${m}:${sec}`;
    }
  </script>
</body>
</html>
